name: CI

on:
  push:
    branches:
      - main
      - feature/github-actions
  pull_request:
    branches:
      - main

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

permissions:
  contents: read

env:
  PYTHON_VERSION: "3.10"
  BUN_VERSION: "1.3.14"
  PROJECT_NAME: "Full Stack FastAPI Project"
  ENVIRONMENT: "local"
  SECRET_KEY: "ci-secret-key"
  FRONTEND_HOST: "http://127.0.0.1:5173"
  BACKEND_CORS_ORIGINS: "http://127.0.0.1:5173,http://localhost:5173"
  POSTGRES_SERVER: "127.0.0.1"
  POSTGRES_PORT: "5432"
  POSTGRES_USER: "postgres"
  POSTGRES_PASSWORD: "postgres"
  POSTGRES_DB: "app"
  FIRST_SUPERUSER: "admin@example.com"
  FIRST_SUPERUSER_PASSWORD: "ci-admin-password"
  EMAILS_FROM_EMAIL: "info@example.com"
  VITE_API_URL: "http://127.0.0.1:8000"

jobs:
  backend:
    name: Backend lint and tests
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:18
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: app
        ports:
          - 5432:5432
        options: >-
          --health-cmd "pg_isready -U postgres -d app"
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Set up Python
        uses: actions/setup-python@v5
        with:
          python-version: ${{ env.PYTHON_VERSION }}

      - name: Install uv
        run: python -m pip install --upgrade pip uv

      - name: Sync backend dependencies
        run: uv sync --frozen --all-groups --all-packages

      - name: Add virtualenv to PATH
        run: echo "$GITHUB_WORKSPACE/.venv/bin" >> "$GITHUB_PATH"

      - name: Backend lint
        working-directory: backend
        run: bash scripts/lint.sh

      - name: Backend tests
        working-directory: backend
        run: bash scripts/test.sh

  frontend:
    name: Frontend lint and build
    runs-on: ubuntu-latest
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Setup Bun
        uses: oven-sh/setup-bun@v2
        with:
          bun-version: ${{ env.BUN_VERSION }}

      - name: Cache Bun packages
        uses: actions/cache@v4
        with:
          path: ~/.bun/install/cache
          key: ${{ runner.os }}-bun-${{ hashFiles('bun.lock') }}
          restore-keys: |
            ${{ runner.os }}-bun-

      - name: Install frontend dependencies
        run: bun install

      - name: Frontend lint
        run: bun run lint

      - name: Frontend build
        run: bun run --filter frontend build

  docker-build:
    name: Docker builds
    runs-on: ubuntu-latest
    needs:
      - backend
      - frontend
    steps:
      - name: Check out code
        uses: actions/checkout@v4

      - name: Build backend image
        run: docker build --pull -f backend/Dockerfile .

      - name: Build frontend image
        run: docker build --pull --build-arg VITE_API_URL=http://127.0.0.1:8000 -f frontend/Dockerfile .
