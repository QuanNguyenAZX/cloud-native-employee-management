apiVersion: v1
kind: ConfigMap
metadata:
  name: employee-management-config
  namespace: employee-management
data:
  PROJECT_NAME: "Employee Management"
  ENVIRONMENT: "local"
  FRONTEND_HOST: "http://employee.local"
  BACKEND_CORS_ORIGINS: "http://employee.local"
  POSTGRES_SERVER: "postgres"
  POSTGRES_PORT: "5432"
  POSTGRES_DB: "app"
  OBJECT_STORAGE_ENDPOINT: "http://minio:9000"
  OBJECT_STORAGE_BUCKET: "avatars"
  OBJECT_STORAGE_REGION: "us-east-1"
  OBJECT_STORAGE_FORCE_PATH_STYLE: "true"
  SMTP_HOST: ""
  SMTP_PORT: "587"
  SMTP_TLS: "true"
  SMTP_SSL: "false"
  EMAILS_FROM_EMAIL: "noreply@employee.local"
