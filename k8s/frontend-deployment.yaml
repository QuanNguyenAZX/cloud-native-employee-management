apiVersion: apps/v1
kind: Deployment
metadata:
  name: employee-frontend
  namespace: employee-management
  labels:
    app.kubernetes.io/name: employee-frontend
spec:
  replicas: 1
  selector:
    matchLabels:
      app.kubernetes.io/name: employee-frontend
  template:
    metadata:
      labels:
        app.kubernetes.io/name: employee-frontend
    spec:
      containers:
        - name: frontend
          image: employee-frontend:local
          imagePullPolicy: IfNotPresent
          ports:
            - name: http
              containerPort: 80
          readinessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 5
            periodSeconds: 10
            timeoutSeconds: 5
            failureThreshold: 6
          livenessProbe:
            httpGet:
              path: /
              port: 80
            initialDelaySeconds: 30
            periodSeconds: 20
            timeoutSeconds: 5
            failureThreshold: 6
          resources:
            requests:
              cpu: 50m
              memory: 64Mi
            limits:
              cpu: 200m
              memory: 256Mi
